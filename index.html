<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euforia Tour 맛집 앱</title>
<style>
  :root {
    --fine: #7C3AED;
    --value: #16A34A;
    --rooftop: #0EA5E9;
    --seafood: #F97316;
    --market: #0D9488;
    --dessert: #DB2777;
    --korean: #DC2626;
    --chinese: #CA8A04;
    --ink: #1A1A2E;
    --sub: #6B6B80;
    --bg: #F4F3FB;
    --card: #FFFFFF;
    --border: #ECEAF6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app { max-width: 1080px; margin: 0 auto; padding-bottom: 60px; }

  .hero {
    background: linear-gradient(120deg, #7C3AED 0%, #DB2777 45%, #F97316 100%);
    padding: 40px 24px 84px;
    text-align: center;
    color: #fff;
    border-radius: 0 0 28px 28px;
  }
  .hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.4px; }
  .hero p { margin: 0; font-size: 14px; opacity: 0.92; }

  .searchbar {
    max-width: 680px;
    margin: -46px auto 0;
    padding: 0 20px;
  }
  .searchbar input {
    width: 100%;
    padding: 14px 18px;
    font-size: 15px;
    border: none;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(80,40,140,0.18);
    outline: none;
    font-family: inherit;
  }
  .searchbar input::placeholder { color: #A7A5BE; }

  .countrytabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 26px 20px 0;
  }
  .countrytabs button {
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    padding: 10px 26px;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: var(--sub);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: all .15s;
  }
  .countrytabs button.active { color: #fff; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,0.2); }
  .countrytabs button[data-country="spain"].active { background: linear-gradient(135deg,#AA151B,#F1BF00); }
  .countrytabs button[data-country="portugal"].active { background: linear-gradient(135deg,#046A38,#DA291C); }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 20px 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: var(--sub);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: all .15s;
    white-space: nowrap;
  }
  .tabs button.active { color: #fff; background: var(--ink); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,0.15); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 20px 6px;
  }
  .chips button {
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--sub);
    transition: all .15s;
  }
  .chips button.active { color: #fff; border-color: transparent; }
  .chips button[data-toggle="certified"] {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px 7px 8px;
    color: #02742F;
    border-color: #6EDBA0;
    background: #F2FCF7;
  }
  .chips button[data-toggle="certified"] img { width: 17px; height: 17px; display: block; }
  .chips button[data-toggle="certified"].active { background: #03C75A; color: #fff; border-color: transparent; }
  .chips button[data-cat="fine"].active { background: var(--fine); }
  .chips button[data-cat="value"].active { background: var(--value); }
  .chips button[data-cat="rooftop"].active { background: var(--rooftop); }
  .chips button[data-cat="seafood"].active { background: var(--seafood); }
  .chips button[data-cat="market"].active { background: var(--market); }
  .chips button[data-cat="dessert"].active { background: var(--dessert); }
  .chips button[data-cat="korean"].active { background: var(--korean); }
  .chips button[data-cat="chinese"].active { background: var(--chinese); }
  .chips button[data-cat="all"].active { background: var(--ink); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
    padding: 16px 20px 8px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 2px 10px rgba(30,20,60,0.06);
    border-left: 5px solid var(--ink);
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(30,20,60,0.12); }
  .card[data-cat="fine"] { border-left-color: var(--fine); }
  .card[data-cat="value"] { border-left-color: var(--value); }
  .card[data-cat="rooftop"] { border-left-color: var(--rooftop); }
  .card[data-cat="seafood"] { border-left-color: var(--seafood); }
  .card[data-cat="market"] { border-left-color: var(--market); }
  .card[data-cat="dessert"] { border-left-color: var(--dessert); }
  .card[data-cat="korean"] { border-left-color: var(--korean); }
  .card[data-cat="chinese"] { border-left-color: var(--chinese); }

  .card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .card h3 { font-size: 16px; font-weight: 800; margin: 0; }
  .price { font-size: 11.5px; font-weight: 800; color: #fff; background: var(--ink); padding: 3px 9px; border-radius: 8px; white-space: nowrap; }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
    color: #fff;
  }
  .card[data-cat="fine"] .tag { background: var(--fine); }
  .card[data-cat="value"] .tag { background: var(--value); }
  .card[data-cat="rooftop"] .tag { background: var(--rooftop); }
  .card[data-cat="seafood"] .tag { background: var(--seafood); }
  .card[data-cat="market"] .tag { background: var(--market); }
  .card[data-cat="dessert"] .tag { background: var(--dessert); }
  .card[data-cat="korean"] .tag { background: var(--korean); }
  .card[data-cat="chinese"] .tag { background: var(--chinese); }

  .badge-reserve {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 999px;
    margin: 0 0 8px 6px;
    color: #B45309;
    background: #FEF3C7;
    border: 1.5px solid #FCD34D;
    white-space: nowrap;
  }

  .badge-certified {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 9px 2px 4px;
    border-radius: 999px;
    margin: 0 0 8px 6px;
    color: #02742F;
    background: #E7F9EF;
    border: 1.5px solid #6EDBA0;
    white-space: nowrap;
    vertical-align: middle;
  }
  .badge-certified img { width: 15px; height: 15px; display: block; }

  .desc { font-size: 13px; color: var(--sub); margin: 0; line-height: 1.55; }

  .empty { text-align: center; color: var(--sub); font-size: 14px; padding: 40px 20px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    padding: 4px 20px 0;
    font-size: 11.5px;
    color: var(--sub);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  footer {
    max-width: 1040px;
    margin: 30px auto 0;
    padding: 18px 20px 0;
    font-size: 12px;
    color: var(--sub);
    border-top: 1px solid var(--border);
  }

  @media print {
    .tabs, .chips, .searchbar, .countrytabs { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <h1>Euforia Tour 맛집 앱</h1>
    <p>스페인 · 포르투갈 18개 도시 맛집 큐레이션</p>
  </div>

  <div class="searchbar">
    <input type="text" id="search" placeholder="식당 이름이나 키워드로 검색 (예: 해산물, 루프탑, 핀초스)">
  </div>

  <div class="countrytabs" id="countrytabs">
    <button class="active" data-country="spain">스페인</button>
    <button data-country="portugal">포르투갈</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="chips" id="chips">
    <button class="active" data-cat="all">전체</button>
    <button data-cat="fine">미쉐린·파인다이닝</button>
    <button data-cat="value">가성비·로컬</button>
    <button data-cat="rooftop">루프탑·뷰</button>
    <button data-cat="seafood">해산물</button>
    <button data-cat="market">마켓·푸드홀</button>
    <button data-cat="dessert">디저트·카페</button>
    <button data-cat="korean">한식</button>
    <button data-cat="chinese">중식</button>
    <button data-toggle="certified" id="certifiedToggle" aria-pressed="false"><img src="badge-verified.svg" alt="">인증맛집만</button>
  </div>

  <div class="legend">
    <span><i style="background:var(--fine)"></i>미쉐린·파인다이닝</span>
    <span><i style="background:var(--value)"></i>가성비·로컬</span>
    <span><i style="background:var(--rooftop)"></i>루프탑·뷰</span>
    <span><i style="background:var(--seafood)"></i>해산물</span>
    <span><i style="background:var(--market)"></i>마켓·푸드홀</span>
    <span><i style="background:var(--dessert)"></i>디저트·카페</span>
    <span><i style="background:var(--korean)"></i>한식</span>
    <span><i style="background:var(--chinese)"></i>중식</span>
    <span><span class="badge-certified" style="margin:0"><img src="badge-verified.svg" alt="">인증맛집</span>네이버 · 유포리아투어 인증 로컬 맛집</span>
    <span><span class="badge-reserve" style="margin:0">예약필수</span>사전 예약 없이는 입장이 어려운 곳</span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">검색 결과가 없습니다.</div>

  <footer>
    ※ 미쉐린 스타 및 인기 레스토랑은 사전 예약이 필수이며, 일부는 수개월 전 예약이 필요할 수 있습니다.

  </footer>

</div>

  {city:'barcelona', cat:'value', name:'Nou Can Martí', price:'€€', tag:'칼솟 · 전통 로컬', desc:'콜세롤라 산자락에 위치, 자연 속에서 바르셀로나 360도 전망을 즐길 수 있는 유일한 레스토랑. 장작불에 구운 칼솟(11~4월 제철)과 그릴 고기가 시그니처, 주말엔 라이브 음악으로 활기찬 분위기.'},
  {city:'barcelona', cat:'korean', name:'Restaurant Coreà Kamasot', price:'€€', tag:'한식당 · 한국식 바베큐', desc:'에이샴플라 지구 Consell de Cent 465 위치. 테이블마다 불판이 설치되어 있어 고기와 채소를 직접 구워 먹는 한국식 바베큐가 대표. 김치찌개·비빔밥 등 정통 메뉴와 만두·김치전·떡볶이·두부김치 등 안주류(8~13유로대)를 갖췄고 소주·맥주도 준비. 구글 평점 4.5, 2인 45유로 안팎. 대기 방지를 위해 예약 권장.'},
  {city:'barcelona', cat:'korean', name:'Gayagum 가야금', price:'€€', tag:'한식당 · 점심 메뉴 가성비', desc:'전통 악기 가야금에서 이름을 딴 아담한 가족 운영 한식당(그라시아 Sant Gabriel 2 / 에이샴플라 Londres 84). 비빔밥·파전·잡채와 양념갈비·주물럭 등 테이블 구이 메뉴가 인기이며 반찬 구성이 알차다는 평. 15.90유로 점심 메뉴가 양·가격 모두 만족도 높음, 구글 평점 4.6. 좌석이 많지 않아 단체보다는 소규모 방문에 적합.'},
  {city:'barcelona', cat:'korean', name:'SEOUL NADRI 서울나들이', price:'€€', tag:'한식당 · 평점 4.9', desc:'에이샴플라 Roger de Llúria 24 위치, "한국식 바베큐 + 클래식 한식"을 내세운 인기 한식당. 돌솥비빔밥과 테이블 숯불 구이가 대표이며 이베리코 삼겹살·김치찌개·냉면·국물 요리 평이 좋음. 치즈케이크·팬케이크 등 디저트와 소주·와인도 구비. 리뷰 1,000건 이상 기준 평점 4.9로 바르셀로나 한식당 중 최상위권. 예약은 전화 또는 인스타그램 DM.'},
  {city:'barcelona', cat:'korean', name:'Restaurante KANGNAM 강남', price:'€€', tag:'한식당 · 캄노우 인근', desc:'서울 강남에서 이름을 딴 산츠 지구 Jaume Roig 8의 아담한 한식당(메트로 Badal역, 캄 노우 인근). K-POP이 흐르는 아늑한 분위기에서 양념 치킨, 김치·새우 만두, 돌솥 불고기 덮밥, 라면, 잡채 등을 제공. 뚝배기 만둣국 세트(반찬 3종·공깃밥 포함) 13.9유로, 비건 메뉴 28유로. 양이 푸짐하고 서비스 평이 좋으며 만석이 잦아 사전 예약 권장.'},
  {city:'barcelona', cat:'fine', name:'Amar Barcelona (아마르 바르셀로나)', price:'€€€€', tag:'미쉐린 가이드 · 해산물 파인다이닝', reserve:true, desc:'그란 비아 668번지 5성급 호텔 The Palace Barcelona(옛 리츠) 안에 자리한 라파 사프라(Rafa Zafra) 셰프의 해산물 파인다이닝. 마드리드·바르셀로나의 Estimar와 같은 계열로, 카탈루냐어 "사랑하다"에서 이름을 따왔음. 굴과 캐비아, 무게를 달아 파는 최상급 생선을 회·마리네이드·염장·찜·튀김·숯불구이까지 다양하게 조리하며, 로시니 안심 스테이크 같은 숙성육과 호텔의 리츠 시절을 기리는 클래식 메뉴, 바다를 주제로 한 테이스팅 코스 "Amar Lentamente"도 운영. 1919년에 지어진 다이닝룸의 푸른 벽면·금장 몰딩·샹들리에가 만드는 우아한 분위기가 특징으로, 기념일 만찬에 어울림. 화~목 저녁, 금·토 점심과 저녁만 영업(일·월 휴무)하며 좌석이 한정적이라 사전 예약 필수.'},
  {city:'barcelona', cat:'market', name:'El Nacional Barcelona', price:'€€€', tag:'멀티 다이닝 · 그라시아 거리', desc:'파세이그 데 그라시아 24번지, 1889년 건물을 개조해 2014년 문을 연 바르셀로나 최초의 멀티스페이스 레스토랑. 2,600㎡ 공간에 700석 이상을 갖췄고 카페극장·염색공장·자동차 대리점·주차장을 거친 모더니즘 산업 건축 양식이 그대로 보존되어 있음. 한 지붕 아래 4개의 레스토랑(고기 전문 La Braseria, 생선 전문 La Llotja, 타파스·쌀요리 La Tapería, 간단식·베이커리 La Parada)과 맥주·통조림, 와인·하몬, 굴, 칵테일 전문 바 4곳이 함께 있어 일행마다 취향이 달라도 한 자리에서 해결 가능. 이베리아반도 각 지역의 전통 요리를 두루 맛볼 수 있고 낮 12시부터 새벽 2시까지 영업해 늦은 저녁 식사나 야식에도 좋음.'},
  {city:'barcelona', cat:'seafood', name:'CAN RIBES', price:'€€', tag:'빠에야 · 노르드 터미널 인근', desc:'에이샴플라 Carrer de Ribes 19번지, 노르드 버스터미널 택시 승강장 바로 맞은편의 지중해 요리 레스토랑. 해산물 빠에야가 대표 메뉴로 쌀 위에 해산물을 넉넉히 올려주는 것으로 평이 좋고, 오징어 먹물 아로스 네그레·모둠 해산물 플래터·크레마 카탈라나도 인기. 2인용 고기 빠에야가 33유로 안팎이지만 실제로는 3~4인이 나눠 먹을 만큼 양이 푸짐하고, 2인 기준 해산물 플래터에 와인·맥주를 곁들여 70유로 선. 트립어드바이저 트래블러스 초이스 수상, 친절하고 여유로운 서비스와 식후 리몬첼로 서비스로 호평. 넓고 밝은 실내와 테라스석, 단체용 룸을 갖춰 일행 규모가 커도 편하며 예약 가능.'},
  {city:'barcelona', cat:'value', name:'[쯔양먹방] La Flauta', price:'€€', tag:'타파스 · 꿀대구 명가', desc:"에이샴플라 Carrer d'Aribau 23번지, 유튜버 쯔양의 바르셀로나 타파스 투어에서 1등 맛집으로 꼽힌 타파스 바. 꿀을 곁들인 대구 튀김(바칼라오 콘 미엘)이 시그니처로 바르셀로나 3대 꿀대구 맛집 중 하나로 통하며, 판 콘 토마테·뽈뽀(문어)·새우와 오징어 꼬치도 대표 메뉴. 예약을 받지 않아 대기를 감안해 방문해야 하고 인근 주차가 어려워 대중교통 이용을 권장."},
  {city:'barcelona', cat:'value', name:'[쯔양먹방] Los Tortillez', price:'€€', tag:'토르티야 전문 · 로컬', desc:'에이샴플라 Carrer del Consell de Cent 299번지, 스페인식 감자 오믈렛 토르티야를 전문으로 하는 바르셀로나 대표 맛집으로 쯔양이 방문한 곳. 기본 토르티야와 이베리코·초리조를 넣은 버전 등 여러 종류를 갖춰 골라 먹는 재미가 있음. 구글 지도로 예약 가능하며 주차는 유료 노상뿐이라 어려운 편.'},
  {city:'barcelona', cat:'value', name:"[쯔양먹방] La Bodega d'en Rafel", price:'€€', tag:'셰프 추천 숨은 맛집', desc:'에이샴플라 Carrer de Manso 52번지, 현지 셰프들이 추천하는 숨은 맛집으로 쯔양이 방문한 보데가. 튀김 반죽에 재료를 넣어 튀긴 부뉴엘로스, 까날루네스(카넬로니), 미트볼 요리 알본디가스, 달팽이 요리 카라콜레스가 대표 메뉴. 예약은 가능하나 공식 홈페이지 메일 예약이 가장 확실하며 주차는 유료 노상.'},
  {city:'barcelona', cat:'seafood', name:'[쯔양먹방] Àncora Restaurant', price:'€€€', tag:'까라비네로 새우 · 보케리아 인근', desc:'구시가 P. de Sant Josep 13번지, 보케리아 시장 바로 옆에 자리한 해산물 레스토랑. 쯔양의 바르셀로나 먹방에서 까라비네로(홍새우) 맛집으로 소개된 곳으로, 크고 붉은 까라비네로 새우 요리와 해산물 파에야가 대표 메뉴. 시장 구경과 함께 동선에 두기 좋음.'},
  {city:'barcelona', cat:'value', name:'[쯔양먹방] Cerveseria Vaso de Oro', price:'€€', tag:'65년 전통 타파스바', desc:'구시가 Carrer de Balboa 6번지, 바르셀로네타 인근에서 65년째 영업 중인 좁고 긴 스탠딩 타파스 바로 쯔양이 방문한 곳. 참치 샐러드를 비롯한 정통 타파스와 직접 따라주는 생맥주가 유명하고 바 카운터 앞에서 바텐더의 퍼포먼스를 보는 재미가 있음. 예약을 받지 않아 대기가 잦으며 주차는 인근 유료 주차장 이용.'},
  {city:'barcelona', cat:'dessert', name:'Delacrem', price:'€', tag:'수제 젤라토', desc:"에이샴플라 Carrer d'Enric Granados 15번지의 수제 젤라토 가게. 쯔양이 방문을 시도했으나 대기 줄이 너무 길어 결국 포기한 곳으로(영상에는 실제 방문 장면 없음), 그만큼 현지에서 인기가 높다는 증거. 타파스 투어 후 디저트 코스로 들르기 좋으며 붐비는 시간대를 피하는 편이 좋음."},

  {city:'madrid', cat:'fine', name:'DiverXO', price:'€€€€', tag:'미쉐린 3스타', reserve:true, desc:'Dabiz Muñoz 셰프의 실험적 퓨전 요리. 예약 매우 치열.'},
  {city:'madrid', cat:'fine', name:'Coque', price:'€€€€', tag:'미쉐린 2스타', reserve:true, desc:'칵테일·주방·다이닝룸을 옮겨 다니는 투어형 코스 경험.'},
  {city:'madrid', cat:'rooftop', name:'Picalagartos Sky Bar', price:'€€€', tag:'루프탑 · 뷰', desc:'NH Collection Gran Vía 9층, 360도 시내 전망. 8층 레스토랑 예약 가능, 루프탑 바는 선착순.'},
  {city:'madrid', cat:'rooftop', name:'Ginkgo Sky Bar', price:'€€€', tag:'루프탑 · 뷰', desc:'Plaza de España 인근. 스페인-아시아 퓨전(스시, 이베리코 바오번)과 시그니처 칵테일.'},
  {city:'madrid', cat:'fine', name:'Botín (보틴)', price:'€€€', tag:'전통 명가', reserve:true, desc:'1725년 개업, 기네스북 등재 세계 최고(最古) 레스토랑. 새끼돼지 통구이(코치니요)가 시그니처.'},
  {city:'madrid', cat:'value', name:'Latazo (안톤 마틴 시장)', price:'€', tag:'타파스 · 가성비', desc:'현지인들이 즐겨찾는 시장 내 타파스. 관광객 적어 한산한 편.'},
  {city:'madrid', cat:'market', name:'산 미구엘 시장', price:'€€', tag:'마켓 · 푸드홀', desc:'100년 넘은 역사의 시장. 신선한 해산물 타파스부터 다양한 먹거리를 소량씩 시식.'},
  {city:'madrid', cat:'dessert', name:'Chocolatería San Ginés', price:'€', tag:'츄러스 · 디저트', desc:'1894년 개업, 마드리드 대표 츄러스 명소. 마요르 광장 인근, 늦은 밤에도 영업.'},
  {city:'madrid', cat:'value', name:'La Bola', price:'€€', tag:'코시도 · 전통 로컬', desc:'150년 넘은 전통 레스토랑. 병아리콩·소시지·닭고기를 흙냄비에 몇 시간 고아낸 코시도 마드리레뇨 대표 명가.'},
  {city:'madrid', cat:'value', name:'Bar El Rocío', price:'€€', tag:'타파스 · 가성비', desc:'솔 지구 파사헤 데 마테우 위치, 현지인에게도 사랑받는 타파스 바. 홍합찜·튀긴 오징어·갈릭 새우·버섯구이 등 신선한 타파스가 인기, 평점 4.8의 로컬 맛집.'},
  {city:'madrid', cat:'value', name:'Malaspina', price:'€€', tag:'타파스 · 전통 타베르나', desc:'브라보 무리요 거리, 차베리 지구의 전통 타베르나. 파타타스 브라바스·우에보스 로토스·빠에야 등 정통 스페인 타파스를 편안한 분위기에서 즐길 수 있음.'},
  {city:'madrid', cat:'chinese', name:'Restaurante de Sichuan', price:'€€', tag:'정통 쓰촨 요리', desc:'카바예로 데 그라시아 거리 위치, 쓰촨 출신 셰프가 운영하는 정통 쓰촨 요리 전문점. 고추·산초를 쓰촨에서 직수입해 만드는 마라 풍미의 요리로 현지 중국인들에게도 정평.'},
  {city:'madrid', cat:'value', name:'Mesón del Champiñón', price:'€€', tag:'버섯구이 · 전통 명물', desc:'1964년 개업, 플라자 마요르 인근 카바 데 산 미겔 거리의 전통 타베르나. 마늘·파슬리·초리조로 볶아낸 시그니처 버섯구이(참피뇬)가 명물, 항아리 상그리아와 함께 즐기기 좋음.'},
  {city:'madrid', cat:'fine', name:'Raza Madrid Chamberí', price:'€€€€', tag:'프리미엄 스테이크하우스', desc:'차베리 지구 에두아르도 다토 거리 위치, 아르헨티나·핀란드·스페인산 프리미엄 소고기를 취급하는 그릴 레스토랑. 와규 타르타르와 1kg 초대형 촐레톤(티본)이 시그니처, 우아한 분위기의 미식 스테이크하우스.'},
  {city:'madrid', cat:'chinese', name:'Shishang (Shi-Shang)', price:'€', tag:'채식 뷔페 · 중식', desc:'솔 지구 콘셉시온 아레날 거리 위치, 12년 넘게 운영 중인 마드리드 대표 중식 채식 뷔페. 세이탄·두부로 재현한 탕수육·잡채 등 다양한 메뉴를 합리적 가격에 즐길 수 있음.'},
  {city:'madrid', cat:'korean', name:'Han Gang (한강)', price:'€€', tag:'한식당 · 평점 4.6', desc:'마드리드의 인기 한식당. 구글 평점 4.6(리뷰 510건)으로 현지에서도 높은 평가, 1인 10~20유로 수준의 합리적인 가격대. 매장 식사와 포장 주문 모두 가능하며 영업 마감은 22:30.'},
  {city:'madrid', cat:'value', name:'La Posada del Nuncio (라 포사다 델 눈시오)', price:'€€€', tag:'카스티소 요리 · 라 라티나', desc:'라 라티나 지구 눈시오 거리 4번지, 마요르 광장과 보틴에서 도보 거리. 방송에도 출연한 셰프 하비에르 산체스가 운영하며 전통 카스티소 요리에 현대적 감각을 더한 곳. 바삭한 토레스노스와 파타타스 레볼코나스, 카라바냐 텃밭 토마토 요리, 보를레투스 아로스 멜로소가 대표 메뉴이며 치즈 플란·아랍식 타르트 등 디저트도 인기. 나무와 화초로 꾸민 아늑한 실내와 봄·여름 인기 테라스, 1인 50유로 안팎.'},
  {city:'madrid', cat:'fine', name:'Ramón Freixa Madrid (라몬 프레익사 마드리드)', price:'€€€€', tag:'미쉐린 2스타 · 이전 개업', reserve:true, desc:'카탈루냐 출신 셰프 라몬 프레익사의 미쉐린 2스타 레스토랑. 살라망카 지구 오텔 우니코에 있던 원래 매장은 2024년 12월 문을 닫고, 벨라스케스 거리 24번지에 정통 스페인 요리의 "Tradición"과 파인다이닝 "Atelier" 두 개 콘셉트로 새롭게 문을 열었음. 전통과 아방가르드를 넘나드는 테이스팅 메뉴가 핵심이며 하몬 커팅 바와 칵테일 바도 운영. 방문 전 현재 운영 매장·메뉴 확인 후 사전 예약 필수.'},
  {city:'madrid', cat:'fine', name:'El Paraguas (엘 파라과스)', price:'€€€€', tag:'아스투리아스 요리 · 살라망카', reserve:true, desc:'살라망카 지구 호르헤 후안 16번지, 아마소니코로 유명한 산드로 실바·마르타 세코 부부의 첫 레스토랑. 파바다·베르디나스·픽신 튀김 등 아스투리아스 정통 요리에 정교한 코스를 더했고 대파와 새우 토스타, 성게 크로케타, 킹크랩 파베스가 시그니처. 제철 버섯·수렵 요리와 방대한 와인 리스트를 갖췄으며 겨울엔 유리로 감싸는 테라스가 매력. 1인 평균 79유로대, 구글 평점 4.3(리뷰 3,100건 이상). 비즈니스 식사로 붐벼 예약 필수.'},
  {city:'madrid', cat:'fine', name:'Asador Real (아사도르 레알)', price:'€€€', tag:'장작구이 · 전통 아사도르', desc:'이사벨 2세 광장 1번지, 왕궁·오리엔테 광장·테아트로 레알 바로 옆(메트로 오페라역 20m). 1996년부터 장작 화덕에 구운 새끼돼지 통구이(세고비아식 코치니요)와 젖먹이 양 구이가 대표 메뉴이며, 숯불 소갈비(추레톤)·양갈비·생선 구이도 인기. 760㎡ 규모에 돌·나무·벽돌로 꾸민 카스티야풍 살롱 3곳과 여름 테라스를 갖췄고 리베라 델 두에로·리오하 중심 와인 리스트 보유. 12:00~24:00 연중무휴, 인근 주차장 2시간 무료.'},

  {city:'sevilla', cat:'korean', name:'Moon Restaurante', price:'€€', tag:'한식당 · 야외석', desc:'Avenida Menéndez Pelayo 8, 세비야 구시가 동편에 위치한 한식당. 야외 테라스석을 갖추고 있어 날씨 좋은 날 식사하기 좋으며, 리뷰 6건 기준 추천율 100%. 장기 여행 중 한식이 그리울 때 들르기 좋음. 예약·문의 +34 664 41 75 18 / moonkoreanrestaurant1.placeweb.site'},
  {city:'sevilla', cat:'fine', name:'Casa Manolo León (카사 마놀로 레온)', price:'€€€', tag:'안달루시아 요리 · 저택 정원', reserve:true, desc:'구시가 산 로렌소 지구 과달키비르 거리 8번지, 19세기 말 귀족 저택을 개조해 1999년 레온 형제가 문을 연 세비야의 대표 고급 안달루시아 레스토랑. 2개 층에 성격이 다른 실내 공간 4곳과 안달루시아식 파티오, 2층 비밀 정원까지 갖췄고 분수·오렌지나무·재스민이 어우러진 파티오 자리가 특히 인기(요청해도 배정이 어려울 수 있음). 이베리코 벨로타 하몽, 토마토 보로니아와 하몬을 곁들인 바삭한 아티초크, 마놀로 레온 크로케타, 주름감자를 곁들인 문어 그릴 구이, 새끼돼지 통구이가 대표 메뉴이며 디저트 토시니요 데 시엘로도 유명. 트립어드바이저 평점 4.3(리뷰 1,878건), 더포크 9.2점으로 기념일·로맨틱한 저녁 식사에 어울림. 평일 13:30~16:00·20:00~24:00, 주말은 심야까지 영업하며 저녁 9시 전후로 금세 만석이 되므로 예약 필수.'},

  {city:'granada', cat:'value', name:'Bar Ávila', price:'€', tag:'하몬 아사도 · 무료타파스', desc:'그라나다 특유의 무료 타파스 문화 대표 맛집. 담백하게 익힌 돼지고기를 올린 하몬 아사도가 시그니처.'},

  {city:'granada', cat:'value', name:'El Rincón de Julio (엘 링콘 데 훌리오)', price:'€€', tag:'소꼬리찜 · 평점 4.9', reserve:true, desc:'그라나다 타파스 명소로 유명한 나바스 거리 27번지에 위치한 작은 로컬 식당. 다섯 시간 동안 뭉근히 고아낸 소꼬리찜(라보 데 토로)이 시그니처로 결대로 부드럽게 풀어지는 식감이 일품이고, 주인장 훌리오의 장모님 레시피로 만들어 주문 즉시 튀겨내는 닭고기·버섯 크로케타, 갈리시아식 문어, 뼈째 익힌 돼지 정강이(코디요), 대구와 오렌지·양파를 버무린 그라나다 향토 샐러드 레모혼도 인기. 구글 평점 4.9(리뷰 수천 건), 1인 9~23유로대. 훌리오가 직접 손님을 맞는 정겨운 분위기지만 테이블이 5~6개뿐이라 왓츠앱 사전 예약 권장(667 88 00 00). 그라나다답게 음료를 주문하면 무료 타파가 함께 나옴.'},
  {city:'granada', cat:'value', name:'Perromedio Taberna (페로메디오 타베르나)', price:'€€', tag:'안달루시아 타베르나 · 평점 4.9', reserve:true, desc:'대성당에서 가까운 마르케스 데 헤로나 거리 17번지, "안달루시아의 맛을 담은 타베르나"를 표방하는 인기 로컬 식당. 전통 레시피를 현대적으로 다듬은 소접시 요리가 중심으로 이베리코 하몽, 부라타 샐러드, 하몽 보카디요, 치즈 플레이트가 대표 메뉴이며 치즈케이크와 파르페 등 디저트, 그라나다 최고로 꼽히는 상그리아도 평이 좋음. 리뷰 7,000건 이상 기준 평점 4.9, 1인 10~20유로대. 주인장이 손님 앞에서 직접 요리를 완성해 주고 가족사진으로 꾸민 아늑한 실내가 매력이지만 테이블이 몇 개 없어 저녁에는 예약 없이 자리 잡기 어려움(예약 642 05 47 76). 매일 12:00~16:00, 18:30~24:00 영업. 토마토 샐러드에 함께 나오는 빵은 2유로 별도 과금이니 참고.'},
  {city:'granada', cat:'korean', name:'한국식당 CHOIBAP 최밥', price:'€€', tag:'한식당 · 평점 4.7', desc:'그라나다 도심 파브리카 비에하 거리, 트리니다드 광장 바로 옆에 자리한 한식당. 양념치킨과 불고기 등 고기 요리, 각종 전, 소주가 대표 메뉴로 손꼽히며 정겨운 분위기와 친절한 서비스, 합리적인 가격대로 현지에서도 인기. 리뷰 1,179건 기준 평점 4.7(구글 평점도 동일)로 그라나다 한식당 중 상위권이며 1인 10~20유로 수준. 채식 손님은 고기를 두부로 바꿔 주문할 수 있음. 문의 958 005 214, 글로보 배달도 가능해 숙소에서 먹기에도 좋음.'},
  {city:'granada', cat:'korean', name:'Restaurante Coreano Miso (미소)', price:'€€', tag:'한식당 · 그라나다 최초', reserve:true, desc:'알함브라로 오르는 고메레스 언덕길 20번지(센트로 아니마스 거리에도 매장)에 위치한 그라나다 최초의 한식당. 비빔밥·김치·불고기 등 기본에 충실한 메뉴를 갖췄고, 크기와 매운맛 단계를 고르거나 허니 소스로 주문할 수 있는 한국식 프라이드치킨이 가장 인기. 맵지 않은 메뉴와 채식 메뉴도 다양해 일행 구성이 달라도 무난함. 트립어드바이저 평점 4.3(리뷰 119건, 그라나다 1,968개 식당 중 298위), 다른 플랫폼 기준 4.2(리뷰 550건). K-POP이 흐르는 아늑한 분위기로 늘 붐비므로 주말에는 사전 예약 권장(+34 693 059 000 / 858 69 37 24). 알함브라 관람 전후 동선에 두기 좋음.'},

  {city:'lisboa', cat:'value', name:'El-Rei Dom Frango', price:'€€', tag:'포르투갈식 통닭 · 로컬', desc:'호시우역 인근 칼사다 두 두케 5번지의 작은 로컬 식당(슈하스케이라). 숯불에 구운 포르투갈식 통닭(프랑구 아사두)과 매콤한 피리피리 치킨이 간판 메뉴이며, 문어구이와 바칼라우 아 브라스, 도미구이 등 신선한 생선 요리도 평이 좋음. 오픈 키친의 소박한 나무 테이블 분위기, 리뷰 4,300건 이상 기준 평점 4.6. 좌석이 적고 테라스가 없으며 카드 결제가 안 되는 현금 전용이라 방문 전 현금 준비 필요. 1인 25~30유로 안팎, 월~금 12:00~23:30 영업.'},
  {city:'lisboa', cat:'value', name:'Lisboa Tu & Eu', price:'€€', tag:'알파마 가족 식당 · 낙서 벽', desc:'알파마 골목(R. Adiça 58)에서 시작한 가족 운영 전통 식당으로, 현재는 에스카디냐스 다스 포르타스 두 마르의 2호점과 프라사 다스 플로레스 45번지 비스트로점도 운영. 정어리구이·문어구이·바칼라우 아 브라스·대구 크림 요리·새우 파스타가 대표 메뉴이고 상그리아가 특히 유명. 식사 후 직원이 매직펜을 건네주면 벽에 글을 남기는 낙서 벽 전통이 명물. 구글 평점 4.6, 좁고 가파른 계단으로만 올라가는 아담한 공간이라 사전 예약 권장, 현금 결제 선호.'},
  {city:'lisboa', cat:'seafood', name:'Taverna Alfacinha', price:'€€', tag:'해물밥 · 미니 타베르나', reserve:true, desc:'바이샤 지구 사파테이루스 거리 179번지의 아주 작은 전통 타베르나. 포르투갈식 해물밥 아호스 드 마리스쿠와 해산물 파에야가 시그니처이며, 오징어 먹물로 지은 검은 파에야·문어구이·바칼라우도 인기. 양이 푸짐하고 나무 테이블과 아줄레주 타일로 꾸민 러스틱한 실내에 파두 음악이 흐름(라이브 공연은 없음). 리뷰 9,000건 이상 기준 평점 4.9로 최상위권이지만 좌석이 18석 남짓이라 대기가 길어, 사전 예약이 사실상 필수.'},
  {city:'lisboa', cat:'value', name:'Flor de Lisboa', price:'€', tag:'문어밥 · 현지인 맛집', desc:'관광지에서 살짝 벗어난 피코아스 지구 안드라드 코르부 거리 7B에 위치, 현지인 단골이 많은 소박한 가족 식당. 문어밥(아호스 드 폴부)과 해산물 먹물밥, 정어리구이, 생선 수프, 새우 요리가 대표 메뉴이며 2인분으로 시키면 남을 만큼 양이 넉넉함. 구글 평점 4.4(리뷰 1,300건 이상), 1인 10~15유로대의 저렴한 가격. 매일 09:00~24:00 영업하며 카드 결제와 야외 테라스석도 가능해 접근성이 좋음.'},
  {city:'lisboa', cat:'chinese', name:'Shoo Loong Kan Hotpot 小龍坎', price:'€€€', tag:'쓰촨 훠궈 · 마라', desc:'2014년 쓰촨·충칭에서 시작해 전 세계 1,000개 이상 매장을 낸 마라 훠궈 브랜드의 리스본 지점. 파르크 다스 나송이스 오리엔테역 건물(Av. Dom João II) 안에 있어 접근이 편리함. 마라·백탕·토마토 육수를 반반으로 고를 수 있고 토마토 육수가 특히 호평, 손으로 썬 소고기와 버섯 모둠·고구마 당면이 추천 메뉴. 2유로 안팎에 소스 바와 과일·젤리를 무제한 이용 가능하며 앞치마 제공, 단체용 룸도 갖춤. 리뷰 7,100건 이상 기준 평점 4.9. 저녁 1인 30~35유로, 평일 12~18시 12.9유로부터 시작하는 점심 메뉴 운영. 매운맛은 절반 단계도 상당히 매우니 주의.'},

const tabsEl = document.getElementById('tabs');
const chipsEl = document.getElementById('chips');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const countryButtons = document.querySelectorAll('#countrytabs button');
const certifiedToggle = document.getElementById('certifiedToggle');

let activeCountry = 'spain';
let activeCity = 'barcelona';
let activeCat = 'all';
let certifiedOnly = false;

function renderTabs() {
  const cities = CITIES.filter(c => c.country === activeCountry);
  tabsEl.innerHTML = '';
  cities.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.name;
    btn.dataset.city = c.id;
    if (c.id === activeCity) btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeCity = c.id;
      renderTabs();
      renderGrid();
    });
    tabsEl.appendChild(btn);
  });
}

function renderGrid() {
  const q = searchEl.value.trim().toLowerCase();
  const items = R.filter(r => {
    if (r.city !== activeCity) return false;
    if (activeCat !== 'all' && r.cat !== activeCat) return false;
    if (certifiedOnly && !r.certified) return false;
    if (q && !(r.name.toLowerCase().includes(q) || r.tag.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || (r.reserve && '예약필수'.includes(q)) || (r.certified && '인증맛집'.includes(q)))) return false;
    return true;
  });
  gridEl.innerHTML = '';
  items.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = r.cat;
    card.innerHTML = `
      <div class="top-row"><h3></h3><span class="price"></span></div>
      <span class="tag"></span>
      ${r.certified ? '<span class="badge-certified"><img src="badge-verified.svg" alt="">인증맛집</span>' : ''}
      ${r.reserve ? '<span class="badge-reserve">예약필수</span>' : ''}
      <p class="desc"></p>
    `;
    card.querySelector('h3').textContent = r.name;
    card.querySelector('.price').textContent = r.price;
    card.querySelector('.tag').textContent = r.tag;
    card.querySelector('.desc').textContent = r.desc;
    gridEl.appendChild(card);
  });
  emptyEl.style.display = items.length ? 'none' : 'block';
}

countryButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    countryButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCountry = btn.dataset.country;
    activeCity = CITIES.find(c => c.country === activeCountry).id;
    renderTabs();
    renderGrid();
  });
});

chipsEl.querySelectorAll('button[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    chipsEl.querySelectorAll('button[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    renderGrid();
  });
});

searchEl.addEventListener('input', renderGrid);

certifiedToggle.addEventListener('click', () => {
  certifiedOnly = !certifiedOnly;
  certifiedToggle.classList.toggle('active', certifiedOnly);
  certifiedToggle.setAttribute('aria-pressed', String(certifiedOnly));
  renderGrid();
});

renderTabs();
renderGrid();
</script>
